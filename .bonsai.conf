disabled  = []
errors    = []
warnings  = []
wildcards = 2
baseline  = bonsai-baseline.tsv
purity    = bonsai-purity.tsv
# scalac and javac each load their plugin as one jar, so the two plugins keep their own copies.
intended = ["net.kurobako.bonsai.plugin.JdkPackages=net.kurobako.bonsai.java.JdkPackages", "net.kurobako.bonsai.plugin.JdkPackages.Modules=net.kurobako.bonsai.java.JdkPackages"]
bounded = [
  {
    member = "net.kurobako.bonsai.plugin.Exceptions.*.around"
    max = 8
    reason = "the handlers around a call are the try blocks enclosing it in one method"
  },
  {
    member = "net.kurobako.bonsai.analysis.Complexity.Declared.globs"
    max = 64
    reason = "one entry per declared bound in the build configuration"
  },
  {
    member = "net.kurobako.bonsai.analysis.Polynomial.terms"
    max = 256
    reason = "a product with more terms than the cap is kept opaque"
  },
  {
    member = "net.kurobako.bonsai.analysis.Purity.violations.policies"
    max = 16
    reason = "one policy per effects entry in the build configuration"
  },
  {
    member = "net.kurobako.bonsai.analysis.ComplexityPatternsSuite.silent.names"
    max = 4
    reason = "a test names a handful of methods"
  },
  {
    member = "net.kurobako.bonsai.analysis.AnalysisSuite.extract.twins"
    max = 4
    reason = "a test builds a few platform twins"
  },
  {
    member = "scalafix.compat.RuleCompatibilitySuite.ruleNames"
    max = 64
    reason = "the rules registered by the plugin"
  }
]
# Builds that apply the sbt plugin reach its keys and rule ids, which this build never names.
projects.sbtBonsai { library = true }
