name: community

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      projects:
        description: 'Projects as a JSON array or one JSON object per line: {"url": ..., "ref": ..., "java": 17, "sbt": [...], "name": ...}; empty for community/projects.jsonl'
        required: false
        default: ''
        type: string
      shards:
        description: Jobs for the projects on the default memory, at most 256; 0 for one job per project, empty for about twenty projects per job
        required: false
        default: ''
        type: string
      project-timeout-minutes:
        description: Wall-clock limit of one project's sbt run
        required: false
        default: '60'
        type: string
      memory:
        description: Memory cap of one project's container, for the projects that set none
        required: false
        default: 12g
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: key
        run: echo "key=community-image-$(sha256sum community/Containerfile | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: image.tar.zst
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          podman build -t localhost/bonsai-community:latest -f community/Containerfile community
          podman save localhost/bonsai-community:latest | zstd -T0 -19 -o image.tar.zst
          ls -l image.tar.zst
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: image.tar.zst
          key: ${{ steps.key.outputs.key }}

  bonsai:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - run: |
          set -euo pipefail
          sbt --batch "-Dsbt.ivy.home=$RUNNER_TEMP/ivy" "-Divy.home=$RUNNER_TEMP/ivy" publishLocalAll
          tar -C "$RUNNER_TEMP/ivy" -cf - local | zstd -T0 -3 -o "$RUNNER_TEMP/bonsai-ivy.tar.zst"
      - uses: actions/upload-artifact@v7
        with:
          name: bonsai-ivy
          path: ${{ runner.temp }}/bonsai-ivy.tar.zst
          compression-level: 0
          retention-days: 1

  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      previous: ${{ steps.previous.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-scala-cli
      - run: community/test.scala
      - id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=community-baseline&per_page=100" \
            | community/baseline.scala main "$GITHUB_RUN_ID")
          if [[ -n $run ]]; then
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name community-baseline --dir "$RUNNER_TEMP/previous"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          PROJECTS: ${{ inputs.projects }}
          SHARDS: ${{ inputs.shards }}
          MEMORY: ${{ inputs.memory }}
          PREVIOUS: ${{ steps.previous.outputs.run }}
        run: |
          set -euo pipefail
          list=community/projects.jsonl
          if [[ -n $PROJECTS ]]; then
            list=$RUNNER_TEMP/projects.json
            printf '%s' "$PROJECTS" > "$list"
          fi
          options=(--projects "$list" --planned planned.jsonl --shards "$SHARDS" --memory "$MEMORY")
          if [[ -n $PREVIOUS ]]; then options+=(--previous "$RUNNER_TEMP/previous"); fi
          community/plan.scala "${options[@]}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: community-plan
          path: planned.jsonl
          retention-days: 1

  build:
    needs: [image, bonsai, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Enable zram
        if: matrix.swap != ''
        run: |
          set -euo pipefail
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          if ! sudo modprobe zram; then
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends "linux-modules-extra-$(uname -r)"
            sudo modprobe zram
          fi
          kib=$(awk '/^MemTotal:/ {print $2}' /proc/meminfo)
          device=$(sudo zramctl --find --size "$((kib * 4))KiB")
          sudo mkswap "$device"
          sudo swapon -p 5 "$device"
          swapon --show
          free -h
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-scala-cli
      - uses: actions/cache/restore@v6
        with:
          path: image.tar.zst
          key: ${{ needs.image.outputs.key }}
          fail-on-cache-miss: true
      - run: zstd -dc image.tar.zst | podman load
      - run: podman info --format 'cgroups {{.Host.CgroupsVersion}}, manager {{.Host.CgroupManager}}, controllers {{.Host.CgroupControllers}}'
      - uses: actions/download-artifact@v8
        with:
          name: bonsai-ivy
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: community-plan
          path: ${{ runner.temp }}
      - env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ needs.plan.outputs.count }}
          TIMEOUT_MINUTES: ${{ inputs.project-timeout-minutes || '60' }}
          MEMORY: ${{ matrix.memory }}
          SWAP: ${{ matrix.swap }}
          HEAP: ${{ matrix.heap }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ivy"
          zstd -dc "$RUNNER_TEMP/bonsai-ivy.tar.zst" | tar -C "$RUNNER_TEMP/ivy" -xf -
          options=(--ivy "$RUNNER_TEMP/ivy" --out "$GITHUB_WORKSPACE/out" --memory "$MEMORY" --heap "$HEAP")
          if [[ -n $SWAP ]]; then options+=(--memory-swap "$SWAP"); fi
          community/shard.scala "$RUNNER_TEMP/planned.jsonl" "$SHARD" "$SHARDS" $((345 * 60)) $((TIMEOUT_MINUTES * 60)) "${options[@]}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: outputs-${{ matrix.shard }}
          path: out
          retention-days: 7
          if-no-files-found: warn

  report:
    needs: [plan, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-scala-cli
      - uses: actions/download-artifact@v8
        with:
          pattern: outputs-*
          path: out
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: community-plan
          path: ${{ runner.temp }}
      - env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS: ${{ needs.plan.outputs.previous }}
        run: |
          set -euo pipefail
          options=()
          if [[ -n $PREVIOUS ]]; then
            gh run download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --name community-baseline --dir "$RUNNER_TEMP/previous"
            options+=(--previous "$RUNNER_TEMP/previous" --previous-run "$PREVIOUS")
          fi
          community/report.scala --out out --projects "$RUNNER_TEMP/planned.jsonl" --summary "$GITHUB_STEP_SUMMARY" \
            --report report --baseline baseline "${options[@]}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: community-report
          path: report
          retention-days: 30
          if-no-files-found: warn
      - if: ${{ !cancelled() && needs.build.result == 'success' && inputs.projects == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: community-baseline
          path: baseline
          retention-days: 30
          if-no-files-found: error
