name: setup-scala-cli
description: scala-cli at the version community/Containerfile pins
outputs:
  binary-key:
    description: cache key of the pinned scala-cli binary
    value: ${{ steps.binary.outputs.key }}
  binary-hit:
    description: whether the pinned binary was restored from cache
    value: ${{ steps.cache.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: binary
      shell: bash
      run: |
        set -euo pipefail
        url=$(sed -n 's/^ARG SCALA_CLI_URL=//p' community/Containerfile)
        sha=$(sed -n 's/^ARG SCALA_CLI_SHA256=//p' community/Containerfile)
        test -n "$url" && test -n "$sha"
        echo "key=scala-cli-$(printf '%s%s' "$url" "$sha" | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        echo "url=$url" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@v6
      id: cache
      with:
        path: ${{ runner.temp }}/bin/scala-cli
        key: ${{ steps.binary.outputs.key }}
    - if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SCALA_CLI_URL: ${{ steps.binary.outputs.url }}
        SCALA_CLI_SHA256: ${{ steps.binary.outputs.sha }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/bin"
        curl -fsSL -o "$RUNNER_TEMP/scala-cli.gz" "$SCALA_CLI_URL"
        echo "$SCALA_CLI_SHA256  $RUNNER_TEMP/scala-cli.gz" | sha256sum -c -
        gunzip -c "$RUNNER_TEMP/scala-cli.gz" > "$RUNNER_TEMP/bin/scala-cli"
        chmod +x "$RUNNER_TEMP/bin/scala-cli"
    - shell: bash
      run: echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
