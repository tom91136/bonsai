rules = [
  DisableSyntax
  BannedSyntax
  CollectionIdioms
  CompanionOrder
  ExplicitEtaExpansion
  FilenameConventions
  FinalValPascalCase
  ForbiddenAPIs
  NamespaceImports
  NoBoxedPrimitives
  NoPackagePrivate
  RedundantCaseClassVal
  RequireTailRec
  SimplifyMatch
  CaseClassEquality
  MutableExposure
  PublicSignatures
  TemporalCoupling
  GivenPlacement
  MiddleMan
  TransparentOpaque
  PackageNaming
  AnonymousGiven
  PatternShadow
  TargetName
  QualifiedPrivate
  QualifiedCollectionNamespaces
  RedundantSyntax
  RemoveUnused
  ExplicitResultTypes
]

DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noVars = true
DisableSyntax.noXml = true
DisableSyntax.noFinalize = true
NamespaceImports.packages = ["net.kurobako.baumkuchen"]
ForbiddenAPIs.symbols = {
  "java/lang/System#" = "use Scala APIs or a narrow platform abstraction instead of java.lang.System"
  "java/lang/Runtime#" = "use scala.sys.runtime instead of java.lang.Runtime"
}
lint.error = true
