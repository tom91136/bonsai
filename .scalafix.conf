rules = [
  DisableSyntax
  BannedSyntax
  CollectionIdioms
  CompanionOrder
  ExplicitEtaExpansion
  FilenameConventions
  FinalValPascalCase
  ForbiddenAPIs
  NamespaceImports
  NoBoxedPrimitives
  RedundantCaseClassVal
  RequireTailRec
  SimplifyMatch
  MutableExposure
  PublicSignatures
  GivenPlacement
  TransparentOpaque
  PackageNaming
  AnonymousGiven
  PatternShadow
  TargetName
  QualifiedPrivate
  QualifiedCollectionNamespaces
  DerivedConstants
  ReversedIndexing
  RestatedLookup
  DanglingDocComment
  DuplicateAnnotation
  DisjunctionTables
  FoldIdentity
  RedundantSyntax
  RemoveUnused
  ExplicitResultTypes
]

DisableSyntax.noNulls = true
DisableSyntax.noReturns = true
DisableSyntax.noVars = true
DisableSyntax.noXml = true
DisableSyntax.noFinalize = true
NamespaceImports.packages = ["net.kurobako.bonsai"]
ForbiddenAPIs.symbols = {
  "java/lang/System#" = "use Scala APIs or a narrow platform abstraction instead of java.lang.System"
  "java/lang/Runtime#" = "use scala.sys.runtime instead of java.lang.Runtime"
}
ExplicitResultTypes.fetchScala3CompilerArtifactsOnVersionMismatch = true
