# The audit mode compiles what the compiler plugin finds fault with, and the analysis reports it with its own findings
# and fails at the end. The second run compiles nothing, and reports the findings of the first compile again.
invoker.goals.1 = clean verify -Dbonsai.mode=audit -Dbonsai.version=${project.version}
invoker.buildResult.1 = failure
invoker.goals.2 = verify -Dbonsai.mode=audit -Dbonsai.version=${project.version}
invoker.buildResult.2 = failure
